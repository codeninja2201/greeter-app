name: Sync upstream

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 13 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PATH }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/fadonic/greeter-app.git

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "actions@github.com"

      - name: Run sync script
        id: sync
        run: bash scripts/sync-upstream.sh

      - name: Push sync branch
        if: steps.sync.outputs.SYNC_BRANCH != ''
        run: git push origin HEAD:${{ steps.sync.outputs.SYNC_BRANCH }} --force

      - name: Open pull request
        if: steps.sync.outputs.SYNC_BRANCH != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_PATH }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.sync.outputs.SYNC_BRANCH }}" \
            --title "Upstream sync (${{ steps.sync.outputs.MERGE_STATUS }})" \
            --body "Automated upstream sync. Status: ${{ steps.sync.outputs.MERGE_STATUS }}" \
            --label upstream-sync
